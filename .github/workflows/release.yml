name: release

# Push a tag like v1.1.0 to build both apps and publish a GitHub Release with a Mac zip and a Windows zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: scripts/test.sh

      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh

      - name: Zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "build/Shift Happens.app" "dist/Shift-Happens-${GITHUB_REF_NAME#v}-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test windows/tests/ShiftCore.Tests -c Release

      - name: Publish and zip
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish windows/src/ShiftHappens -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:Version=$v -o out
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/ShiftHappens.exe -DestinationPath "dist/Shift-Happens-$v-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Shift Happens $GITHUB_REF_NAME" \
            --generate-notes
