name: release

# Push a tag like v1.0.1 to build the app and publish a GitHub Release with the zip(s).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: scripts/test.sh

      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh

      - name: Zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "build/Shift Happens.app" "dist/Shift-Happens-${GITHUB_REF_NAME#v}-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.zip

  release:
    needs: [mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Shift Happens $GITHUB_REF_NAME" \
            --generate-notes
